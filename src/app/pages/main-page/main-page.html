<div class="flex flex-row" (mouseup)="onMouseUp($event)">
  <div
    #marker_component
    class="w-44 h-12 absolute hidden"
    [style.top.px]="y_marker_position()"
    [style.left.px]="x_marker_position()"
  >
    <marker-component class="w-full h-full" (colorMark)="handlerSelected($event)" />
  </div>

  <div
    #mark_options_component
    class="absolute bottom-0 right-0 dark-bg light-bg w-24 h-10 rounded text-2xl dark:border-gray-500 border-2 hidden z-30"
    [style.top.px]="y_mark_options_position()"
    [style.left.px]="x_mark_options_position()"
  >
    <mark-options-component class="w-full h-full flex justify-around items-center" />
  </div>

  <div class="flex flex-col" #text_option>
    <bible-option-component [text_option]="text_option" />

    <div>
      @if (current_book() === undefined) {
      <p class="text-2xl text-center select-none">{{lang.data()?.bible_empty}}</p>
      } @else { @for (chapter of current_book()?.chapters; track $index) {
      <div
        class=""
        elementVisible
        #div_chapter
        [id]="$index"
        (visible)="handler_chapter_visibility($index + 1, true)"
        (notVisible)="handler_chapter_visibility($index + 1, false)"
      >
        <h1
          [id]="`${this.bible_services.current_book()?.nr}-${chapter.chapter}`"
          #chap_header
          class="font-bold text-center my-2 select-none"
          [style.fontSize.px]="fontSettingsServices.font_size() * 1.5"
        >
          {{chapter?.name}}
        </h1>

        @for (verse of chapter?.verses; track $index) {
        <p
          [id]="`${this.bible_services.current_book()?.nr}-${chapter.chapter}-${verse.verse}`"
          #versiculo
          [style.fontSize.px]="fontSettingsServices.font_size()"
          [class.inline]="fontSettingsServices.is_inline()"
        >
          <sup class="font-bold z-0 select-none"> {{$index + 1}} </sup>
          <span class="flex-1"> {{verse.text}} </span>
        </p>
        }
      </div>
      } }
    </div>
  </div>
</div>
