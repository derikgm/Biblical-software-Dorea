<div
  #menu_container
  class="dark-bg light-bg absolute flex h-full w-full items-center justify-around rounded border-2 shadow-md"
  [style.z-index]="10"
>
  <button
    type="button"
    aria-label="Rojo"
    (click)="this.colorMark.emit(0)"
    class="reset-button h-6 w-6 rounded-full border border-gray-500 bg-red-700"
  ></button>
  <button
    type="button"
    aria-label="Azul"
    (click)="this.colorMark.emit(1)"
    class="reset-button h-6 w-6 rounded-full border border-gray-500 bg-blue-700"
  ></button>
  <button
    type="button"
    aria-label="Verde"
    (click)="this.colorMark.emit(2)"
    class="reset-button h-6 w-6 rounded-full border border-gray-500 bg-green-700"
  ></button>
  <button
    type="button"
    aria-label="Violeta"
    (click)="this.colorMark.emit(3)"
    class="reset-button h-6 w-6 rounded-full border border-gray-500 bg-violet-700"
  ></button>
  <button
    type="button"
    aria-label="Quitar marca"
    (click)="this.colorMark.emit(4)"
    class="reset-button flex h-6 w-6 items-center justify-center rounded-full border border-black"
  >
    <ng-icon name="cruz" />
  </button>
</div>
